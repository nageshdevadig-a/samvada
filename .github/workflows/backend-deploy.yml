name: Deploy to Azure
on:
  push:
    branches: [ main ] # Runs every time you push to main
    paths:
      - 'server/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Built-in token for pushing

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile # Change if your Dockerfile is elsewhere
          push: true
          # Image name must be lowercase
          tags: ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Login to GHCR on the VM
            echo "${{ secrets.GH_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Go to project folder
            mkdir -p ~/samvada && cd ~/samvada
            
            # 3. Pull the latest image
            sudo docker pull ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
            
            # 4. Restart the container (assuming docker-compose.yml is already there)
            sudo docker compose up -d
